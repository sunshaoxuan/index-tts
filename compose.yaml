name: indextts25

services:
  studio:
    image: indextts25-product-studio:1.1.73-e4385fa
    build:
      context: .
      dockerfile: Dockerfile.app-update
      args:
        BASE_IMAGE: indextts25-product-studio:1.1.72-ef34480
        APP_REVISION: ${INDEXTTS_APP_REVISION:-e4385fab4fb5848371ab43f73bb8e5e57540f4c5}
    container_name: indextts25-product-studio
    restart: unless-stopped
    init: true
    ports:
      - "7864:7864"
    environment:
      INDEXTTS_OLLAMA_ENDPOINT: http://host.docker.internal:11434
      INDEXTTS_PYTHON: /app/.venv/bin/python
      INDEXTTS_VOICE_PYTHON: /opt/voice-venv/bin/python
      PYTHONUTF8: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: volume
        source: models-ssd
        target: /app/checkpoints
        read_only: true
      - type: bind
        source: C:/workspace/IndexTTS-2.5/runtime-python/python3.11/site-packages
        target: /app/.venv/lib/python3.11/site-packages
        read_only: true
      - type: bind
        source: D:/workspace/IndexTTS-2.5/outputs
        target: /app/outputs
      - type: bind
        source: D:/workspace/IndexTTS-2.5/runtime-output
        target: /app/runtime-output
      - type: bind
        source: D:/workspace/IndexTTS-2.5/artifacts
        target: /app/artifacts
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  models-ssd:
    name: indextts25-models-ssd
    external: true
